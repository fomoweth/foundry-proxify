[profile.default]
src = "src"
out = "out"
libs = ["lib"]
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./out" }]

[profile.default.fuzz]
runs = 1_000

[profile.ci.fuzz]
runs = 5_000

[fmt]
single_line_imports = true
ignore = ["lib/**", "out/**"]

[lint]
lint_on_build = false
ignore = ["lib/**", "out/**"]

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options